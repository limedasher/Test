<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Archive Stream</title>
  <style>
    :root {
      --bg: #0a0a0e;
      --surface: #14141c;
      --surface-hover: #1f1f2b;
      --accent: #e4007c;
      --accent-glow: rgba(228, 0, 124, 0.35);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      padding-bottom: 48px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10, 10, 14, 0.94);
      backdrop-filter: blur(12px);
      padding: 14px 16px;
      border-bottom: 1px solid rgba(228, 0, 124, 0.18);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand {
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span { color: var(--accent); }

    .status-tag {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 700;
      background: rgba(228, 0, 124, 0.12);
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(228, 0, 124, 0.3);
    }

    .search-box { display: flex; gap: 8px; }

    input[type="search"] {
      flex: 1;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="search"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 10px;
      scrollbar-width: none;
    }
    .pills::-webkit-scrollbar { display: none; }

    .pill {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .section { margin-top: 22px; }

    .section-header {
      padding: 0 16px 10px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .section-title { font-size: 1.05rem; font-weight: 700; }

    .clear-link {
      font-size: 0.78rem;
      color: var(--accent);
      background: none;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 16px 8px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .row::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 132px;
      scroll-snap-align: start;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .card:active { transform: scale(0.96); }

    .poster-wrap {
      position: relative;
      width: 132px;
      height: 196px;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .type-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(228, 0, 124, 0.9);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .year-badge {
      position: absolute;
      bottom: 8px;
      right: 6px;
      background: rgba(0,0,0,0.82);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255,255,255,0.2);
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
    }

    .card-title {
      margin-top: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-sub {
      margin-top: 2px;
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
      gap: 14px;
      padding: 16px;
    }
    .grid .card { flex: unset; width: 100%; }
    .grid .poster-wrap { width: 100%; height: 175px; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }
    .modal.open { display: flex; }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #000;
      border-bottom: 1px solid rgba(228, 0, 124, 0.25);
    }

    .close-btn {
      background: var(--surface);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    video {
      width: 100%;
      max-height: 42vh;
      background: #000;
    }

    .audio-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 16px 8px;
      background: linear-gradient(180deg, rgba(228,0,124,0.18) 0%, var(--bg) 100%);
    }

    .audio-box img {
      width: 132px;
      height: 132px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid var(--accent);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    audio {
      width: 100%;
      max-width: 440px;
    }

    .playlist-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 12px 16px 4px;
    }

    .playlist-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .ep-nav-btn {
      background: var(--surface);
      color: #fff;
      border: 1px solid rgba(228, 0, 124, 0.35);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .ep-nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: rgba(255,255,255,0.1);
    }

    .ep-counter {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
    }

    .chapter-list {
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .chapter-item {
      padding: 10px 14px;
      font-size: 0.84rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .chapter-item:last-child { border-bottom: none; }
    .chapter-item.active {
      color: var(--accent);
      font-weight: 700;
      background: rgba(228, 0, 124, 0.12);
    }

    .speed-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 12px 16px 0;
    }

    .speed-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-right: 4px;
      font-weight: 600;
    }

    .speed-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .speed-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .details { padding: 16px; }
    .details h2 { font-size: 1.3rem; margin-bottom: 6px; }
    .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; }
    .resume-note {
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: none;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .btn {
      background: var(--surface);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    .desc {
      color: #d1d5db;
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .status {
      text-align: center;
      color: var(--muted);
      padding: 36px 16px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="brand"><span>▶</span> ARCHIVE STREAM</div>
      <div class="status-tag" id="statusTag">All</div>
    </div>
    <div class="search-box">
      <input type="search" id="searchInput" placeholder="Search, paste archive.org URL, user:xyz, col:xyz..." />
    </div>
    <div class="pills" id="modePills">
      <button class="pill active" data-mode="ALL">All</button>
      <button class="pill" data-mode="MOVIES">Movies</button>
      <button class="pill" data-mode="SHOWS">TV Shows</button>
      <button class="pill" data-mode="AUDIOBOOKS">Audiobooks</button>
      <button class="pill" data-mode="RECENT">Recent Releases</button>
      <button class="pill" data-mode="MY_LIST">★ My List</button>
    </div>
  </header>

  <main id="mainContent"></main>

  <div class="modal" id="playerModal">
    <div class="modal-top">
      <span id="playerLabel" style="font-size:0.85rem; color:var(--accent); font-weight:700;">Now Playing</span>
      <button class="close-btn" id="closeModal">✕ Close</button>
    </div>

    <video id="videoPlayer" controls playsinline preload="metadata"></video>

    <div class="audio-box" id="audioBox">
      <img id="audioCover" src="" alt="Cover" />
      <audio id="audioPlayer" controls preload="metadata"></audio>
    </div>

    <div class="playlist-panel" id="playlistPanel">
      <div class="playlist-controls">
        <button class="ep-nav-btn" id="prevEpBtn">⏮ Prev</button>
        <span class="ep-counter" id="epCounter">Episode 1 of 1</span>
        <button class="ep-nav-btn" id="nextEpBtn">Next ⏭</button>
      </div>
      <div class="chapter-list" id="chapterList"></div>
    </div>

    <div class="speed-bar" id="speedBar">
      <span class="speed-label">Speed:</span>
      <button class="speed-btn" data-speed="0.85">0.85x</button>
      <button class="speed-btn active" data-speed="1">1x</button>
      <button class="speed-btn" data-speed="1.25">1.25x</button>
      <button class="speed-btn" data-speed="1.5">1.5x</button>
      <button class="speed-btn" data-speed="1.75">1.75x</button>
      <button class="speed-btn" data-speed="2">2x</button>
    </div>

    <div class="details">
      <h2 id="movieTitle">Loading...</h2>
      <div class="meta" id="movieMeta"></div>
      <div class="resume-note" id="resumeNote"></div>
      <div class="actions">
        <button class="btn btn-primary" id="castBtn">📺 Cast to TV</button>
        <button class="btn" id="pipBtn">🖼️ Pop-Out</button>
        <button class="btn" id="bgAudioBtn">🎧 Audio Only</button>
        <button class="btn" id="favBtn">☆ Add to My List</button>
        <a class="btn" id="vlcBtn" href="#">🎬 VLC / External</a>
        <a class="btn" id="archiveLink" href="#" target="_blank">🔗 Archive Page</a>
      </div>
      <p class="desc" id="movieDesc"></p>
    </div>
  </div>

  <script>
    const STRICT_MOVIE_SCOPE = `collection:(feature_films OR film_noir OR SciFi_Horror OR comedy_films OR silent_films OR opensource_movies) AND mediatype:movies AND -collection:(television OR tvnews OR newsandpublicaffairs OR ephemeral_films OR prelinger)`;
    const STRICT_SHOW_SCOPE = `collection:(classic_tv OR sitcoms OR television_shows OR animationandcartoons) AND mediatype:movies AND -collection:(tvnews OR newsandpublicaffairs)`;
    const STRICT_BOOK_SCOPE = `collection:(librivoxaudio OR audio_bookspoetry) AND mediatype:audio`;

    const JUNK_EXCLUDE = `-title:(trailer OR preview OR promo OR clip OR newsreel OR commercial OR speech OR lecture OR interview OR "news" OR "broadcast" OR "birth" OR "surgery" OR "medical") -subject:(news OR medical OR surgery OR "home movies" OR educational OR instructional OR advertisement)`;

    const ROWS_BY_MODE = {
      ALL: [
        { title: "Popular Feature Films", query: STRICT_MOVIE_SCOPE, kind: "Movie" },
        { title: "Classic & Binge-Worthy TV Series", query: STRICT_SHOW_SCOPE, kind: "Show" },
        { title: "Top Audiobooks & Literature", query: STRICT_BOOK_SCOPE, kind: "Book" },
        { title: "Action & Adventure", query: `${STRICT_MOVIE_SCOPE} AND subject:(action OR adventure)`, kind: "Movie" },
        { title: "Comedies", query: `${STRICT_MOVIE_SCOPE} AND subject:(comedy OR farce OR slapstick)`, kind: "Movie" },
        { title: "Horror & Thrillers", query: `${STRICT_MOVIE_SCOPE} AND subject:(horror OR thriller OR noir OR mystery)`, kind: "Movie" },
        { title: "Sci-Fi & Fantasy", query: `${STRICT_MOVIE_SCOPE} AND subject:("science fiction" OR fantasy OR scifi)`, kind: "Movie" },
        { title: "Critically Acclaimed Dramas", query: `${STRICT_MOVIE_SCOPE} AND subject:(drama)`, kind: "Movie" },
        { title: "Documentaries", query: `collection:(documentary_films OR feature_films) AND subject:(documentary) AND mediatype:movies AND -collection:(tvnews OR newsandpublicaffairs)`, kind: "Doc" },
        { title: "Animated Series & Cartoons", query: `collection:(animationandcartoons) AND mediatype:movies`, kind: "Anim" }
      ],
      MOVIES: [
        { title: "Most Watched Feature Films", query: STRICT_MOVIE_SCOPE, kind: "Movie" },
        { title: "Action & Adventure", query: `${STRICT_MOVIE_SCOPE} AND subject:(action OR adventure)`, kind: "Movie" },
        { title: "Comedies", query: `${STRICT_MOVIE_SCOPE} AND subject:(comedy OR farce)`, kind: "Movie" },
        { title: "Drama", query: `${STRICT_MOVIE_SCOPE} AND subject:(drama)`, kind: "Movie" },
        { title: "Horror & Suspense", query: `${STRICT_MOVIE_SCOPE} AND subject:(horror OR suspense)`, kind: "Movie" },
        { title: "Film Noir & Crime", query: `${STRICT_MOVIE_SCOPE} AND subject:(noir OR crime OR mystery)`, kind: "Movie" },
        { title: "Sci-Fi & Fantasy", query: `${STRICT_MOVIE_SCOPE} AND subject:("science fiction" OR fantasy)`, kind: "Movie" },
        { title: "Romance", query: `${STRICT_MOVIE_SCOPE} AND subject:(romance)`, kind: "Movie" },
        { title: "Westerns", query: `${STRICT_MOVIE_SCOPE} AND subject:(western)`, kind: "Movie" },
        { title: "Documentaries", query: `collection:(documentary_films OR feature_films) AND subject:(documentary) AND mediatype:movies AND -collection:(tvnews OR newsandpublicaffairs)`, kind: "Doc" }
      ],
      SHOWS: [
        { title: "Popular TV Series", query: STRICT_SHOW_SCOPE, kind: "Show" },
        { title: "TV Comedies & Sitcoms", query: `${STRICT_SHOW_SCOPE} AND subject:(comedy OR sitcom)`, kind: "Show" },
        { title: "TV Dramas, Crime & Mysteries", query: `${STRICT_SHOW_SCOPE} AND subject:(drama OR mystery OR crime OR detective)`, kind: "Show" },
        { title: "Sci-Fi, Horror & Anthology TV", query: `${STRICT_SHOW_SCOPE} AND subject:("science fiction" OR horror OR fantasy OR suspense)`, kind: "Show" },
        { title: "Western TV Series", query: `${STRICT_SHOW_SCOPE} AND subject:(western)`, kind: "Show" },
        { title: "Animated Series & Cartoons", query: `collection:(animationandcartoons) AND mediatype:movies`, kind: "Show" }
      ],
      AUDIOBOOKS: [
        { title: "Most Downloaded Audiobooks", query: STRICT_BOOK_SCOPE, kind: "Book" },
        { title: "Sci-Fi & Fantasy Audiobooks", query: `${STRICT_BOOK_SCOPE} AND subject:("science fiction" OR fantasy)`, kind: "Book" },
        { title: "Mystery, Thriller & Crime", query: `${STRICT_BOOK_SCOPE} AND subject:(mystery OR detective OR crime OR thriller)`, kind: "Book" },
        { title: "Horror & Ghost Stories", query: `${STRICT_BOOK_SCOPE} AND subject:(horror OR ghost OR gothic)`, kind: "Book" },
        { title: "Classic Fiction & Literature", query: `${STRICT_BOOK_SCOPE} AND subject:(fiction OR novel)`, kind: "Book" },
        { title: "History, Philosophy & Non-Fiction", query: `${STRICT_BOOK_SCOPE} AND subject:(history OR philosophy OR biography)`, kind: "Book" }
      ],
      RECENT: [
        { title: "Recent Independent & Open Movies (2000–Present)", query: `${STRICT_MOVIE_SCOPE} AND year:[2000 TO 2026]`, kind: "Movie" },
        { title: "Modern Documentaries (2000–Present)", query: `collection:(documentary_films OR feature_films OR opensource_movies) AND subject:(documentary) AND mediatype:movies AND -collection:(tvnews OR newsandpublicaffairs) AND year:[2000 TO 2026]`, kind: "Doc" },
        { title: "Modern Sci-Fi & Horror (2000–Present)", query: `${STRICT_MOVIE_SCOPE} AND subject:(horror OR "science fiction") AND year:[2000 TO 2026]`, kind: "Movie" },
        { title: "Recently Recorded Audiobooks (2015–Present)", query: `${STRICT_BOOK_SCOPE} AND year:[2015 TO 2026]`, kind: "Book" }
      ]
    };

    const LIST_KEY = "archive_stream_list";
    const PROGRESS_KEY = "archive_stream_progress";
    const SPEED_KEY = "archive_stream_speed";

    let currentMode = "ALL";
    let currentItem = null;
    let activeMediaEl = null;
    let playbackSpeed = parseFloat(localStorage.getItem(SPEED_KEY) || "1");
    let playlistTracks = [];
    let currentTrackIdx = 0;
    let isAudioOnlyVideo = false;
    let wakeLock = null;

    const mainContent = document.getElementById("mainContent");

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return "0:00";
      const s = Math.floor(sec);
      const hrs = Math.floor(s / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const rem = s % 60;
      if (hrs > 0) return `${hrs}:${String(mins).padStart(2, "0")}:${String(rem).padStart(2, "0")}`;
      return `${mins}:${String(rem).padStart(2, "0")}`;
    }

    function getMyList() {
      try { return JSON.parse(localStorage.getItem(LIST_KEY) || "[]"); } catch { return []; }
    }

    function saveMyList(list) {
      localStorage.setItem(LIST_KEY, JSON.stringify(list));
    }

    function getProgressMap() {
      try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}"); } catch { return {}; }
    }

    function saveProgress(identifier, data) {
      const map = getProgressMap();
      map[identifier] = { ...map[identifier], ...data, updatedAt: Date.now() };
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(map));
    }

    function clearContinueWatching() {
      localStorage.removeItem(PROGRESS_KEY);
      if (currentMode !== "MY_LIST" && !document.getElementById("searchInput").value.trim()) {
        loadHome();
      }
    }

    function updateFavBtn() {
      const btn = document.getElementById("favBtn");
      if (!currentItem) return;
      const exists = getMyList().some(m => m.identifier === currentItem.identifier);
      btn.textContent = exists ? "★ Saved in My List" : "☆ Add to My List";
    }

    document.getElementById("favBtn").addEventListener("click", () => {
      if (!currentItem) return;
      let list = getMyList();
      const idx = list.findIndex(m => m.identifier === currentItem.identifier);
      if (idx >= 0) {
        list.splice(idx, 1);
      } else {
        list.unshift(currentItem);
      }
      saveMyList(list);
      updateFavBtn();
      if (currentMode === "MY_LIST") renderMyList();
    });

    function applyPlaybackSpeed(speed) {
      playbackSpeed = speed;
      localStorage.setItem(SPEED_KEY, String(speed));
      document.getElementById("audioPlayer").playbackRate = speed;
      document.getElementById("videoPlayer").playbackRate = speed;
      document.querySelectorAll(".speed-btn").forEach(btn => {
        btn.classList.toggle("active", parseFloat(btn.dataset.speed) === speed);
      });
    }

    document.getElementById("speedBar").addEventListener("click", (e) => {
      if (!e.target.classList.contains("speed-btn")) return;
      applyPlaybackSpeed(parseFloat(e.target.dataset.speed));
    });

    function updateMediaSession(title, artist, artworkUrl) {
      if (!("mediaSession" in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: title || "Archive Stream",
        artist: artist || "Internet Archive",
        album: "Archive Stream",
        artwork: artworkUrl ? [{ src: artworkUrl, sizes: "512x512", type: "image/jpeg" }] : []
      });

      navigator.mediaSession.setActionHandler("play", () => activeMediaEl && activeMediaEl.play());
      navigator.mediaSession.setActionHandler("pause", () => activeMediaEl && activeMediaEl.pause());
      navigator.mediaSession.setActionHandler("seekbackward", () => {
        if (activeMediaEl) activeMediaEl.currentTime = Math.max(0, activeMediaEl.currentTime - 15);
      });
      navigator.mediaSession.setActionHandler("seekforward", () => {
        if (activeMediaEl) activeMediaEl.currentTime = Math.min(activeMediaEl.duration || Infinity, activeMediaEl.currentTime + 15);
      });
      navigator.mediaSession.setActionHandler("previoustrack", playlistTracks.length > 1 ? () => switchTrack(currentTrackIdx - 1, 0) : null);
      navigator.mediaSession.setActionHandler("nexttrack", playlistTracks.length > 1 ? () => switchTrack(currentTrackIdx + 1, 0) : null);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && activeMediaEl && !activeMediaEl.ended && activeMediaEl.dataset.userPaused !== "true") {
        setTimeout(() => {
          if (activeMediaEl && activeMediaEl.paused && activeMediaEl.dataset.userPaused !== "true") {
            activeMediaEl.play().catch(() => {});
          }
        }, 150);
      }
    });

    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => { wakeLock = null; });
        }
      } catch {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    async function fetchArchive(customQuery, rows = 18, skipJunkFilter = false) {
      const fullQuery = skipJunkFilter ? customQuery : `(${customQuery}) AND ${JUNK_EXCLUDE}`;
      const url = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(fullQuery)}&fl[]=identifier,title,year,mediatype,runtime,downloads&sort[]=downloads+desc&rows=${rows}&page=1&output=json`;
      const res = await fetch(url);
      const data = await res.json();
      const docs = data.response.docs || [];

      if (skipJunkFilter) return docs;

      return docs.filter(doc => {
        if (doc.mediatype === "audio" || !doc.runtime) return true;
        const parts = String(doc.runtime).split(":").map(Number);
        if (parts.some(isNaN)) return true;
        let mins = 0;
        if (parts.length === 3) mins = parts[0] * 60 + parts[1];
        else if (parts.length === 2) mins = parts[0];
        else mins = parts[0] / 60;
        return mins >= 12;
      });
    }

    function createCard(doc, kindOverride = "", progress = null) {
      const card = document.createElement("div");
      card.className = "card";

      const isAudio = doc.mediatype === "audio";
      const badgeText = kindOverride || doc.kind || (isAudio ? "Audio" : "Video");
      const thumbUrl = `https://archive.org/services/img/${doc.identifier}`;

      let progressHtml = "";
      let subText = "";
      if (progress && progress.duration > 0) {
        const pct = Math.min(100, Math.round((progress.time / progress.duration) * 100));
        progressHtml = `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;
        if (progress.trackCount > 1) {
          const unit = isAudio ? "Ch" : "Ep";
          subText = `${unit} ${(progress.trackIndex || 0) + 1}/${progress.trackCount} • ${pct}%`;
        } else {
          subText = `${pct}% watched`;
        }
      }

      card.innerHTML = `
        <div class="poster-wrap">
          <span class="type-badge">${badgeText}</span>
          <img src="${thumbUrl}" loading="lazy" alt="${doc.title || doc.identifier}" />
          ${doc.year ? `<span class="year-badge">${doc.year}</span>` : ""}
          ${progressHtml}
        </div>
        <div class="card-title">${doc.title || doc.identifier}</div>
        ${subText ? `<div class="card-sub">${subText}</div>` : ""}
      `;

      card.onclick = () => openItem(doc.identifier, doc.title || doc.identifier, doc.year || "", doc.mediatype || "movies", badgeText);
      return card;
    }

    function buildSection(title, docs, kind, progressMap = {}, clearBtnFn = null) {
      if (!docs.length) return null;
      const section = document.createElement("section");
      section.className = "section";

      const header = document.createElement("div");
      header.className = "section-header";
      header.innerHTML = `<h3 class="section-title">${title}</h3>`;

      if (clearBtnFn) {
        const btn = document.createElement("button");
        btn.className = "clear-link";
        btn.textContent = "Clear History";
        btn.onclick = clearBtnFn;
        header.appendChild(btn);
      }

      const row = document.createElement("div");
      row.className = "row";
      docs.forEach(doc => row.appendChild(createCard(doc, kind, progressMap[doc.identifier])));

      section.appendChild(header);
      section.appendChild(row);
      return section;
    }

    function renderMyList() {
      const list = getMyList();
      const progressMap = getProgressMap();
      mainContent.innerHTML = "";
      if (!list.length) {
        mainContent.innerHTML = `<div class="status">Your list is empty. Tap any title and hit "Add to My List" to save it here.</div>`;
        return;
      }
      const grid = document.createElement("div");
      grid.className = "grid";
      list.forEach(doc => grid.appendChild(createCard(doc, doc.kind, progressMap[doc.identifier])));
      mainContent.appendChild(grid);
    }

    async function loadHome() {
      if (currentMode === "MY_LIST") return renderMyList();

      mainContent.innerHTML = `<div class="status">Loading ${document.getElementById("statusTag").textContent}...</div>`;
      const fragment = document.createDocumentFragment();
      const progressMap = getProgressMap();

      const continueItems = Object.values(progressMap)
        .filter(item => item && item.identifier && item.time > 5)
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      if (continueItems.length) {
        const sec = buildSection("Continue Watching & Listening", continueItems, "", progressMap, clearContinueWatching);
        if (sec) fragment.appendChild(sec);
      }

      const rows = ROWS_BY_MODE[currentMode] || ROWS_BY_MODE.ALL;
      const results = await Promise.all(rows.map(r => fetchArchive(r.query, 18).catch(() => [])));

      rows.forEach((r, idx) => {
        const sec = buildSection(r.title, results[idx], r.kind, progressMap);
        if (sec) fragment.appendChild(sec);
      });

      mainContent.innerHTML = "";
      if (!fragment.children.length) {
        mainContent.innerHTML = `<div class="status">Nothing loaded. Check your connection and try again.</div>`;
      } else {
        mainContent.appendChild(fragment);
      }
    }

    function extractArchiveUrlId(input) {
      const match = input.match(/archive\.org\/(?:details|embed|download)\/([^\/?#\s]+)/i);
      return match && match[1] ? decodeURIComponent(match[1]) : null;
    }

    function parseCustomSearch(rawTerm) {
      let hasPrefix = false;
      let remaining = rawTerm;
      const clauses = [];

      remaining = remaining.replace(/(?:^|\s)user:("[^"]+"|\S+)/gi, (_, val) => {
        hasPrefix = true;
        clauses.push(`uploader:${val}`);
        return "";
      });

      remaining = remaining.replace(/(?:^|\s)col:("[^"]+"|\S+)/gi, (_, val) => {
        hasPrefix = true;
        clauses.push(`collection:${val}`);
        return "";
      });

      const keywords = remaining.trim();
      if (keywords) {
        clauses.push(`(title:(${keywords}) OR description:(${keywords}) OR creator:(${keywords}))`);
      }

      return { hasPrefix, queryBody: clauses.join(" AND ") };
    }

    let searchTimer;
    document.getElementById("searchInput").addEventListener("input", (e) => {
      clearTimeout(searchTimer);
      const term = e.target.value.trim();

      searchTimer = setTimeout(async () => {
        if (!term) return loadHome();

        const urlId = extractArchiveUrlId(term);
        if (urlId) {
          e.target.blur();
          openItem(urlId, urlId, "", "movies", "Link");
          return;
        }

        mainContent.innerHTML = `<div class="status">Searching "${term}"...</div>`;

        const { hasPrefix, queryBody } = parseCustomSearch(term);
        let docs = [];

        if (hasPrefix) {
          let mediaFilter = `mediatype:(movies OR audio)`;
          if (currentMode === "MOVIES" || currentMode === "SHOWS") mediaFilter = `mediatype:movies`;
          if (currentMode === "AUDIOBOOKS") mediaFilter = `mediatype:audio`;

          docs = await fetchArchive(`(${queryBody}) AND ${mediaFilter}`, 36, true);
        } else {
          let scope = `(${STRICT_MOVIE_SCOPE}) OR (${STRICT_SHOW_SCOPE}) OR (${STRICT_BOOK_SCOPE})`;
          if (currentMode === "MOVIES") scope = STRICT_MOVIE_SCOPE;
          if (currentMode === "SHOWS") scope = STRICT_SHOW_SCOPE;
          if (currentMode === "AUDIOBOOKS") scope = STRICT_BOOK_SCOPE;

          docs = await fetchArchive(`(${scope}) AND ${queryBody}`, 36, false);
        }

        const progressMap = getProgressMap();
        mainContent.innerHTML = "";
        if (!docs.length) {
          mainContent.innerHTML = `<div class="status">No matches found for "${term}".</div>`;
          return;
        }
        const grid = document.createElement("div");
        grid.className = "grid";
        docs.forEach(doc => grid.appendChild(createCard(doc, "", progressMap[doc.identifier])));
        mainContent.appendChild(grid);
      }, 450);
    });

    document.getElementById("modePills").addEventListener("click", (e) => {
      if (!e.target.classList.contains("pill")) return;
      document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
      e.target.classList.add("active");
      currentMode = e.target.dataset.mode;
      document.getElementById("statusTag").textContent = e.target.textContent;
      document.getElementById("searchInput").value = "";
      loadHome();
    });

    function extractUniqueTracks(files, ext) {
      const raw = files.filter(f => f.name.toLowerCase().endsWith(ext));
      const groups = new Map();

      for (const f of raw) {
        const stem = f.name
          .replace(/\.(mp4|mp3)$/i, "")
          .replace(/(_512kb|_64kb|_128kb|\.ia|_h264|_mpeg4)$/i, "");

        const existing = groups.get(stem);
        const isDerivative = /(_512kb|_64kb|\.ia)/i.test(f.name);
        if (!existing || (!isDerivative && /(_512kb|_64kb|\.ia)/i.test(existing.name)) || (Number(f.size) || 0) > (Number(existing.size) || 0)) {
          groups.set(stem, f);
        }
      }

      return Array.from(groups.values()).sort((a, b) =>
        a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" })
      );
    }

    function cleanTrackTitle(file, index, isAudio) {
      if (file.title && file.title.trim()) return file.title.trim();
      const cleaned = file.name
        .replace(/\.(mp4|mp3)$/i, "")
        .replace(/(_512kb|_64kb|_128kb|\.ia)$/i, "")
        .replace(/[_-]+/g, " ")
        .trim();
      return cleaned || `${isAudio ? "Chapter" : "Episode"} ${index + 1}`;
    }

    function renderPlaylistUI(isAudio) {
      const panel = document.getElementById("playlistPanel");
      const listEl = document.getElementById("chapterList");
      const counterEl = document.getElementById("epCounter");
      const prevBtn = document.getElementById("prevEpBtn");
      const nextBtn = document.getElementById("nextEpBtn");

      if (playlistTracks.length <= 1) {
        panel.style.display = "none";
        return;
      }

      panel.style.display = "flex";
      const unit = isAudio ? "Chapter" : "Episode";
      counterEl.textContent = `${unit} ${currentTrackIdx + 1} of ${playlistTracks.length}`;
      prevBtn.disabled = currentTrackIdx <= 0;
      nextBtn.disabled = currentTrackIdx >= playlistTracks.length - 1;

      listEl.innerHTML = "";
      playlistTracks.forEach((track, idx) => {
        const row = document.createElement("div");
        row.className = "chapter-item" + (idx === currentTrackIdx ? " active" : "");
        const label = cleanTrackTitle(track, idx, isAudio);
        row.innerHTML = `<span>${idx + 1}. ${label}</span><span style="color:var(--muted);white-space:nowrap;">${track.length || ""}</span>`;
        row.onclick = () => {
          document.getElementById("resumeNote").style.display = "none";
          switchTrack(idx, 0);
        };
        listEl.appendChild(row);
      });

      const activeRow = listEl.children[currentTrackIdx];
      if (activeRow) activeRow.scrollIntoView({ block: "nearest" });
    }

    function switchTrack(idx, seekSec = 0) {
      if (idx < 0 || idx >= playlistTracks.length || !currentItem) return;
      currentTrackIdx = idx;

      const isAudio = currentItem.mediatype === "audio";
      const track = playlistTracks[idx];
      const streamUrl = `https://archive.org/download/${currentItem.identifier}/${encodeURIComponent(track.name)}`;
      const thumbUrl = `https://archive.org/services/img/${currentItem.identifier}`;
      const trackLabel = cleanTrackTitle(track, idx, isAudio);
      const resumeNote = document.getElementById("resumeNote");

      renderPlaylistUI(isAudio);
      updateMediaSession(
        playlistTracks.length > 1 ? `${currentItem.title} — ${trackLabel}` : currentItem.title,
        currentItem.creator || "Internet Archive",
        thumbUrl
      );

      const mediaEl = isAudio ? document.getElementById("audioPlayer") : document.getElementById("videoPlayer");
      activeMediaEl = mediaEl;
      mediaEl.dataset.userPaused = "false";
      mediaEl.src = streamUrl;
      mediaEl.playbackRate = playbackSpeed;

      let lastSavedSec = 0;

      mediaEl.onplay = () => {
        mediaEl.dataset.userPaused = "false";
        requestWakeLock();
      };
      mediaEl.onpause = () => {
        if (!document.hidden) mediaEl.dataset.userPaused = "true";
      };

      mediaEl.onloadedmetadata = () => {
        mediaEl.playbackRate = playbackSpeed;
        if (seekSec > 5 && seekSec < (mediaEl.duration - 10 || Infinity)) {
          mediaEl.currentTime = seekSec;
          const unit = isAudio ? "Chapter" : "Episode";
          const prefix = playlistTracks.length > 1 ? `${unit} ${idx + 1} at ` : "from ";
          resumeNote.textContent = `Resumed ${prefix}${formatTime(seekSec)}`;
          resumeNote.style.display = "block";
        }
        mediaEl.play().catch(() => {});
      };

      mediaEl.ontimeupdate = () => {
        const nowSec = Math.floor(mediaEl.currentTime);
        if (Math.abs(nowSec - lastSavedSec) >= 4) {
          lastSavedSec = nowSec;
          saveProgress(currentItem.identifier, {
            ...currentItem,
            trackIndex: idx,
            trackCount: playlistTracks.length,
            time: mediaEl.currentTime,
            duration: mediaEl.duration || 0
          });
        }
      };

      mediaEl.onended = () => {
        if (idx + 1 < playlistTracks.length) {
          saveProgress(currentItem.identifier, {
            ...currentItem,
            trackIndex: idx + 1,
            trackCount: playlistTracks.length,
            time: 0,
            duration: 0
          });
          switchTrack(idx + 1, 0);
        }
      };

      const mime = isAudio ? "audio/mpeg" : "video/mp4";
      document.getElementById("vlcBtn").href = `intent:${streamUrl}#Intent;type=${mime};end`;
    }

    document.getElementById("prevEpBtn").onclick = () => switchTrack(currentTrackIdx - 1, 0);
    document.getElementById("nextEpBtn").onclick = () => switchTrack(currentTrackIdx + 1, 0);

    document.getElementById("pipBtn").addEventListener("click", async () => {
      const video = document.getElementById("videoPlayer");
      if (video.style.display === "none") {
        alert("Audiobooks already play in the background automatically when you switch apps or lock your screen.");
        return;
      }
      if (document.pictureInPictureEnabled && !video.disablePictureInPicture) {
        try {
          if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
          } else {
            await video.requestPictureInPicture();
          }
        } catch (err) {
          alert("Tap Play on the video first before popping it out.");
        }
      } else {
        alert("Pop-out Picture-in-Picture isn't supported in this browser.");
      }
    });

    document.getElementById("bgAudioBtn").addEventListener("click", () => {
      const video = document.getElementById("videoPlayer");
      const audioBox = document.getElementById("audioBox");
      const bgBtn = document.getElementById("bgAudioBtn");

      if (!currentItem || currentItem.mediatype === "audio") return;

      isAudioOnlyVideo = !isAudioOnlyVideo;
      if (isAudioOnlyVideo) {
        video.style.display = "none";
        audioBox.style.display = "flex";
        document.getElementById("audioPlayer").style.display = "none";
        document.getElementById("audioCover").src = `https://archive.org/services/img/${currentItem.identifier}`;
        bgBtn.classList.add("btn-primary");
        bgBtn.textContent = "🎬 Show Video";
        document.getElementById("playerLabel").textContent = "Background Audio Mode";
      } else {
        audioBox.style.display = "none";
        document.getElementById("audioPlayer").style.display = "block";
        video.style.display = "block";
        bgBtn.classList.remove("btn-primary");
        bgBtn.textContent = "🎧 Audio Only";
        document.getElementById("playerLabel").textContent = "Now Watching";
      }
    });

    async function openItem(identifier, fallbackTitle, fallbackYear, mediatype, kind) {
      currentItem = { identifier, title: fallbackTitle, year: fallbackYear, mediatype, kind };
      playlistTracks = [];
      currentTrackIdx = 0;
      isAudioOnlyVideo = false;
      updateFavBtn();
      applyPlaybackSpeed(playbackSpeed);

      const modal = document.getElementById("playerModal");
      const video = document.getElementById("videoPlayer");
      const audioBox = document.getElementById("audioBox");
      const audio = document.getElementById("audioPlayer");
      const resumeNote = document.getElementById("resumeNote");
      const bgBtn = document.getElementById("bgAudioBtn");
      const pipBtn = document.getElementById("pipBtn");

      bgBtn.classList.remove("btn-primary");
      bgBtn.textContent = "🎧 Audio Only";
      modal.classList.add("open");
      document.getElementById("movieTitle").textContent = fallbackTitle;
      document.getElementById("movieMeta").textContent = "Loading episodes & streams...";
      document.getElementById("movieDesc").textContent = "";
      document.getElementById("archiveLink").href = `https://archive.org/details/${identifier}`;
      document.getElementById("playlistPanel").style.display = "none";
      resumeNote.style.display = "none";

      const saved = getProgressMap()[identifier] || null;

      const res = await fetch(`https://archive.org/metadata/${identifier}`);
      const meta = await res.json();
      const files = meta.files || [];
      const info = meta.metadata || {};

      const isAudio = (info.mediatype || mediatype) === "audio";
      currentItem.mediatype = isAudio ? "audio" : "movies";
      currentItem.title = info.title || fallbackTitle;
      currentItem.year = info.year || fallbackYear || "";
      currentItem.creator = info.creator || "";

      document.getElementById("movieTitle").textContent = currentItem.title;

      if (isAudio) {
        video.style.display = "none";
        audioBox.style.display = "flex";
        audio.style.display = "block";
        bgBtn.style.display = "none";
        pipBtn.style.display = "none";
        document.getElementById("playerLabel").textContent = "Listening to Audiobook";
        document.getElementById("audioCover").src = `https://archive.org/services/img/${identifier}`;

        playlistTracks = extractUniqueTracks(files, ".mp3");
      } else {
        audioBox.style.display = "none";
        video.style.display = "block";
        bgBtn.style.display = "inline-flex";
        pipBtn.style.display = "inline-flex";
        document.getElementById("playerLabel").textContent = "Now Watching";

        playlistTracks = extractUniqueTracks(files, ".mp4");
      }

      if (playlistTracks.length) {
        const startIdx = (saved && typeof saved.trackIndex === "number" && saved.trackIndex < playlistTracks.length)
          ? saved.trackIndex
          : 0;
        const startSec = (saved && saved.trackIndex === startIdx) ? (saved.time || 0) : 0;
        switchTrack(startIdx, startSec);
      } else {
        document.getElementById("movieMeta").textContent = "No direct MP4/MP3 stream found—tap Archive Page.";
      }

      const year = currentItem.year;
      const runtime = info.runtime || "";
      const countLabel = playlistTracks.length > 1
        ? `${playlistTracks.length} ${isAudio ? "Chapters" : "Episodes"}`
        : "";
      document.getElementById("movieMeta").textContent = [year, countLabel, runtime, info.creator].filter(Boolean).join(" • ");
      document.getElementById("movieDesc").innerHTML = info.description || "No description available.";
    }

    document.getElementById("castBtn").addEventListener("click", async () => {
      if (activeMediaEl && activeMediaEl.remote && activeMediaEl.remote.prompt) {
        try {
          await activeMediaEl.remote.prompt();
        } catch (err) {
          alert("Tip: Make sure your Chromecast/TV is on the same Wi-Fi, or tap VLC / External next to this button.");
        }
      } else {
        alert("Use Chrome's built-in Cast icon on the player, or tap VLC / External.");
      }
    });

    document.getElementById("closeModal").addEventListener("click", () => {
      const video = document.getElementById("videoPlayer");
      const audio = document.getElementById("audioPlayer");

      if (document.pictureInPictureElement) {
        document.exitPictureInPicture().catch(() => {});
      }

      if (currentItem) {
        const el = currentItem.mediatype === "audio" ? audio : video;
        if (el.currentTime > 5) {
          saveProgress(currentItem.identifier, {
            ...currentItem,
            trackIndex: currentTrackIdx,
            trackCount: playlistTracks.length,
            time: el.currentTime,
            duration: el.duration || 0
          });
        }
      }

      releaseWakeLock();
      video.dataset.userPaused = "true";
      audio.dataset.userPaused = "true";
      video.pause();
      video.removeAttribute("src");
      video.load();
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      document.getElementById("playerModal").classList.remove("open");

      if (!document.getElementById("searchInput").value.trim()) {
        loadHome();
      }
    });

    loadHome();
  </script>
</body>
</html>
